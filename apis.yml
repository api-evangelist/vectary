aid: vectary
name: Vectary
description: >-
  Vectary is a browser-based 3D and augmented reality design platform used to
  create, collaborate on, and publish interactive 3D content — product
  configurators, assembly manuals, and immersive presentations — without
  downloads or code. Serving over four million users across automotive,
  electronics, manufacturing, and furniture, Vectary embeds projects on any
  website via iframe, and its Business-plan Model API (VctrModelApi, a
  JavaScript postMessage wrapper) gives developers programmatic control of
  embedded scenes: switching variants and materials, two-way events, camera,
  animations, textures, and GLB/GLTF/FBX/USDZ import/export, with documented
  e-commerce patterns for Shopify, Webflow, and custom storefronts.
