apis:
- aid: vectary:vectary-model-api
  name: Vectary Model API
  description: >-
    JavaScript API for programmatic control of Vectary 3D scenes embedded on
    websites. The VctrModelApi class (an ES module served from
    app.vectary.com) wraps postMessage communication with the embedded
    iframe, exposing async methods for configuration state, variants,
    materials and textures, two-way events, objects and transforms, camera
    and view state, animations, raycasting, screenshots, and file
    import/export. Available on Business plans; scenes are addressed by the
    Project ID from the embed URL.
  humanURL: https://help.vectary.com/api/model-api
  baseURL: https://app.vectary.com
